[package]
name = "open-todo"
version = "0.0.1"
description = "A desktop shell for open-todo"
authors = ["Alessandro Viganò"]
license = "MIT"
edition = "2021"
rust-version = "1.88.0"

[lib]
name = "open_todo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
log = "0.4"
env_logger = "=0.11.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "=2.11.3", features = [] }
tauri-plugin-dialog = "=2.4.1"
tauri-plugin-single-instance = "=2.3.4"
tauri-plugin-window-state = "=2.4.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.4"

[dev-dependencies]
proptest = "=1.11.0"
tauri = { version = "=2.11.3", features = ["test"] }
